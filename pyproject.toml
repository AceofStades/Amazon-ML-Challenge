[project]
name = "amzn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "rapidfuzz>=3.14.6",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "unidecode>=1.4.0",
    "xgboost>=3.4.1",
]

[project.scripts]
amzn = "amzn:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
